<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0a0c0b">
<title>Financeiro PC</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* ==========================================================================
   FINANCEIRO PC — layout: menu lateral no computador, barra inferior no celular.
   Identidade: grafite quase preto + verde dinheiro. Tema escuro fixo.
   ========================================================================== */
:root{
  --bg:#0a0c0b; --surface:#121513; --surface2:#1a1f1c; --line:#252c28;
  --fg:#e9f0ea; --muted:#8c9990; --accent:#2fd36b; --accent-ink:#04140a;
  --accent-dim:rgba(47,211,107,.14); --danger:#f26d78; --danger-dim:rgba(242,109,120,.14);
  --warn:#e9b44c; --warn-dim:rgba(233,180,76,.14);
  --r:14px; --font-d:'Space Grotesk',system-ui,sans-serif; --font-b:'Inter',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-b);margin:0;
  padding-block:0 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:40}
h1,h2,h3{font-family:var(--font-d);margin:0;font-weight:600;letter-spacing:-.01em;text-wrap:balance}
h1{font-size:26px}h2{font-size:18px}h3{font-size:15px}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.num,.money,.ramt,td.n{font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-columns:230px minmax(0,1fr);gap:32px;max-width:1240px;margin:0 auto}
.side{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;padding:22px 0;display:flex;flex-direction:column;gap:22px;max-height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-d);font-weight:700;letter-spacing:.06em;font-size:15px}
.brand i{width:30px;height:30px;border-radius:9px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--muted);font-weight:500}
.nav a:hover{background:var(--surface);color:var(--fg)}
.nav a.on{background:var(--accent-dim);color:var(--accent)}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.side small{color:var(--muted);font-size:12px;line-height:1.4;margin-top:auto}
.main{min-width:0;padding-bottom:20px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);padding:16px 0 12px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);margin-bottom:22px}
.top h1{flex:1 1 180px}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mnav{display:flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.mnav button{background:none;border:0;padding:8px 12px;cursor:pointer;color:var(--muted);border-radius:12px}
.mnav button:hover{color:var(--fg)}
.mpick{position:relative;display:block;padding:8px 6px;min-width:150px;text-align:center;font-weight:500;cursor:pointer;white-space:nowrap}
.mpick input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;color-scheme:dark}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:11px;padding:10px 16px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:8px;min-height:40px}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--muted)}
.btn.sm{padding:6px 11px;font-size:13px;min-height:32px;border-radius:9px;font-weight:500}
.btn.dng{color:var(--danger)}
.btn.icon{padding:8px;min-height:40px;min-width:40px;justify-content:center}
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr))}
.two{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));align-items:start}
.cards{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.card.hero{background:radial-gradient(120% 140% at 0% 0%,rgba(47,211,107,.16),transparent 60%),var(--surface);border-color:rgba(47,211,107,.28)}
.lbl{color:var(--muted);font-size:13px;display:block;margin-bottom:6px}
.big{white-space:nowrap;font-family:var(--font-d);font-weight:600;font-size:28px;letter-spacing:-.02em;line-height:1.15;display:block}
.hero .big{font-size:36px}
.sub{color:var(--muted);font-size:13px}
.pos{color:var(--accent)}.neg{color:var(--danger)}
.sec{margin-top:26px}
.sec>.sh{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.bar{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden;margin:10px 0 6px}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.over>i{background:var(--danger)}.bar.warn>i{background:var(--warn)}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px 16px;align-items:center;padding:13px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.rmain{display:flex;flex-direction:column;min-width:0}
.rmain strong{font-weight:500;overflow-wrap:anywhere}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.chips:empty{display:none}
.ramt{font-weight:600;text-align:right;white-space:nowrap}
.racts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.chip{font-size:12px;padding:2px 9px;border-radius:99px;background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.chip.ok{background:var(--accent-dim);color:var(--accent);border-color:transparent}
.chip.late{background:var(--danger-dim);color:var(--danger);border-color:transparent}
.chip.wait{background:var(--warn-dim);color:var(--warn);border-color:transparent}
.empty{padding:28px 12px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--fg);font-family:var(--font-d);font-size:17px;margin-bottom:6px;font-weight:600}
.empty .btn{margin:14px 4px 0}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.filters input,.filters select,.fld input,.fld select,.fld textarea{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:42px;width:100%}
.filters input{flex:1 1 220px;width:auto}.filters select{flex:0 1 190px;width:auto}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:0}
.fld{margin-bottom:14px}.fld label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.hint{font-size:12px;color:var(--muted);margin-top:5px}
.err{font-size:12px;color:var(--danger);margin-top:5px;min-height:0}.err:empty{display:none}
.fld.bad input,.fld.bad select{border-color:var(--danger)}
.chk{display:flex;gap:10px;align-items:center;margin:4px 0 4px;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--accent)}
.sugg{display:flex;gap:6px;flex-wrap:wrap;margin:-6px 0 14px}
.sugg button{background:var(--surface2);border:1px solid var(--line);border-radius:99px;padding:4px 11px;font-size:12px;cursor:pointer;color:var(--muted)}
.sugg button:hover{color:var(--fg);border-color:var(--muted)}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:3px}
.seg button{background:none;border:0;border-radius:8px;padding:7px 16px;cursor:pointer;color:var(--muted);font-weight:500}
.seg button.on{background:var(--accent-dim);color:var(--accent)}
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted);margin-bottom:8px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
svg.ch{width:100%;height:auto;display:block;overflow:visible}
svg.ch .grid{stroke:var(--line);stroke-width:1}
svg.ch .zero{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3}
svg.ch .ax{fill:var(--muted);font:11px var(--font-b)}
svg.ch .lv{fill:var(--fg);font:600 12px var(--font-d)}
.motiv{background:linear-gradient(135deg,rgba(47,211,107,.10),transparent 55%),var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;margin-bottom:16px;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.motiv .q{font-family:var(--font-d);font-size:19px;font-weight:500;line-height:1.35;text-wrap:balance;flex:1 1 320px;min-width:0}
.motiv .eb{display:block;color:var(--accent);font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}
.motiv .sub{display:block;margin-top:8px}
.hb{display:flex;flex-direction:column;gap:12px}
.hb .it .t{display:flex;justify-content:space-between;gap:12px;font-size:14px}
.hb .it .t span:last-child{color:var(--muted);white-space:nowrap}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:480px}
th,td{padding:10px 8px;text-align:right;border-top:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-weight:500;font-size:13px;border-top:0}
th:first-child,td:first-child{text-align:left}
tfoot td{font-weight:600}
.banner{background:var(--warn-dim);border:1px solid rgba(233,180,76,.4);color:var(--warn);border-radius:12px;padding:10px 14px;margin-bottom:16px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:14px}
.banner.red{background:var(--danger-dim);border-color:rgba(242,109,120,.4);color:var(--danger)}
body.hide .money{filter:blur(7px);user-select:none}
.tabbar{display:none}
.more a{display:flex;gap:14px;align-items:center}
.more a .ic{width:24px;height:24px;color:var(--accent)}
.more small{display:block;color:var(--muted)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
.ov[hidden]{display:none}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:18px;width:100%;max-width:480px;max-height:calc(100% - 8px);overflow:auto;padding:20px}
.sheet.wide{max-width:640px}
.sh-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.x{background:none;border:0;font-size:26px;line-height:1;cursor:pointer;color:var(--muted);padding:4px 8px}
.sh-foot{display:flex;gap:10px;justify-content:flex-end;margin-top:8px;flex-wrap:wrap}
.sheet textarea{width:100%;min-height:200px;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px;font:12px/1.4 ui-monospace,Menlo,monospace}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:500;z-index:80;opacity:0;pointer-events:none;transition:opacity .2s;max-width:calc(100% - 32px);text-align:center}
#toast.on{opacity:1}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr);gap:0}
  .side{display:none}
  body{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--surface);border-top:1px solid var(--line);justify-content:space-around;padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
  .tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);padding:6px 2px;border-radius:10px;min-width:0}
  .tabbar a.on{color:var(--accent)}
  h1{font-size:22px}
  .hero .big{font-size:32px}
  .row{grid-template-columns:minmax(0,1fr) auto}
  .racts{grid-column:1/-1;justify-content:flex-start}
  .ov{align-items:flex-end;padding-bottom:0}
  .sheet{border-radius:18px 18px 0 0;max-height:92%}
  .mpick{min-width:132px}
}
@media (max-width:420px){input,select,textarea{font-size:16px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>

var validDate=function(s){if(!/^\d{4}-\d{2}-\d{2}$/.test(s))return false;var p=s.split('-').map(Number),d=new Date(p[0],p[1]-1,p[2]);return d.getFullYear()===p[0]&&d.getMonth()===p[1]-1&&d.getDate()===p[2]};

var sum=function(a){return a.reduce(function(s,x){return s+(+x.amount||0)},0)};
var fmtNum=function(v){return (+v).toFixed(2).replace('.',',')};
var fmtC=function(v){var a=Math.abs(v);return (v<0?'−':'')+(a>=1000?(a/1000).toLocaleString('pt-BR',{maximumFractionDigits:1})+' mil':Math.round(a).toLocaleString('pt-BR'))};
/* Converte "1.234,56", "R$ 50", "50.5" em número. Retorna NaN se inválido. */
function parseMoney(s){
  s=String(s).trim().replace(/R\$|\s/g,'');
  if(!s)return NaN;
  if(s.indexOf(',')>-1)s=s.replace(/\./g,'').replace(',','.');
  else if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');
  if(!/^\d+(\.\d+)?$/.test(s))return NaN;
  return Math.round(Number(s)*100)/100;
}

function migrate(d){
  var b=blank();

  var o={v:1};
  o.wallets=Array.isArray(d.wallets)?d.wallets.map(function(w){return{id:w.id||uid(),name:String(w.name||'Carteira'),kind:w.kind==='guardar'?'guardar':'gasto',alloc:+w.alloc||0,moves:arr(w.moves).filter(function(m){return validDate(String(m.date))&&isFinite(m.amount)}).map(function(m){return{id:m.id||uid(),date:m.date,amount:+m.amount}})}}):b.wallets;
  o.tx=arr(d.tx).filter(function(t){return t&&(t.type==='in'||t.type==='out')&&validDate(String(t.date))&&isFinite(t.amount)}).map(function(t){return{id:t.id||uid(),type:t.type,desc:String(t.desc||''),amount:+t.amount,date:t.date,cat:String(t.cat||(t.type==='in'?'Outras rendas':'Outras despesas')),wid:t.wid||null,cid:t.cid||null,paid:t.type==='in'?true:!!t.paid,rid:t.rid||null,gid:t.gid||null}});

  o.cards=arr(d.cards).map(function(c){return{id:c.id||uid(),name:String(c.name||'Cartão'),limit:+c.limit||0,close:+c.close||1,due:+c.due||10}});
  o.rec=arr(d.rec).map(function(r){return{id:r.id||uid(),desc:String(r.desc||''),amount:+r.amount||0,day:+r.day||1,cat:String(r.cat||'Outras despesas'),type:r.type==='in'?'in':'out',wid:r.wid||null,start:r.start||ymOf(todayISO()),skip:arr(r.skip),active:r.active!==false}});
  return o;
}

var byDateDesc=function(a,b){return a.date<b.date?1:a.date>b.date?-1:0};
var byDateAsc=function(a,b){return a.date<b.date?-1:a.date>b.date?1:0};
var txM=function(ym,type){return S.tx.filter(function(t){return t.type===type&&t.date.indexOf(ym)===0})};
function totals(ym){
  var i=txM(ym,'in'),o=txM(ym,'out'),inc=sum(i),out=sum(o),paid=sum(o.filter(function(t){return t.paid}));
  return{inc:inc,out:out,paid:paid,pend:out-paid,net:inc-out,saved:Math.max(0,inc-out),pct:inc>0?out/inc*100:null};
}
var gSaved=function(g){return sum(g.dep)};
var wBal=function(w){return sum(w.moves)};
/* Saldo disponível = receitas já recebidas − despesas pagas − valores guardados em metas e carteiras de reserva */
function balance(){
  var t=todayISO();
  var inc=sum(S.tx.filter(function(x){return x.type==='in'&&x.date<=t}));
  var out=sum(S.tx.filter(function(x){return x.type==='out'&&x.paid}));
  var g=S.goals.reduce(function(s,x){return s+gSaved(x)},0);
  var w=S.wallets.filter(function(x){return x.kind==='guardar'}).reduce(function(s,x){return s+wBal(x)},0);
  return inc-out-g-w;
}
function status(t){if(t.paid)return'paid';var d=todayISO();return t.date<d?'late':t.date===d?'today':'wait'}
function stChip(t){var s=status(t);return s==='paid'?'<span class="chip ok">Paga</span>':s==='late'?'<span class="chip late">Atrasada</span>':s==='today'?'<span class="chip wait">Vence hoje</span>':'<span class="chip wait">A pagar</span>'}
function catTotals(list){var m={};list.forEach(function(t){m[t.cat]=(m[t.cat]||0)+t.amount});return Object.keys(m).map(function(k){return{label:k,value:m[k]}}).sort(function(a,b){return b.value-a.value})}
/* Cartão: a compra entra na fatura do mês do fechamento */
var invYM=function(t,c){return(+t.date.slice(8,10))>c.close?addM(ymOf(t.date),1):ymOf(t.date)};
var invItems=function(c,ym){return S.tx.filter(function(t){return t.cid===c.id&&invYM(t,c)===ym})};
var cardUsed=function(c){return sum(S.tx.filter(function(t){return t.cid===c.id&&!t.paid}))};
function dueDate(c,ym){var m=c.due>c.close?ym:addM(ym,1);return m+'-'+pad(Math.min(c.due,dim(m)))}
/* Contas fixas: gera o lançamento do mês (uma vez) para cada conta recorrente ativa */
function ensureRecurring(ym){
  if(ym>addM(ymOf(todayISO()),1))return;
  var changed=false;
  S.rec.forEach(function(r){
    if(!r.active||ym<r.start||r.skip.indexOf(ym)>-1)return;
    if(S.tx.some(function(t){return t.rid===r.id&&ymOf(t.date)===ym}))return;
    S.tx.push({id:uid(),type:r.type,desc:r.desc,amount:r.amount,date:ym+'-'+pad(Math.min(r.day,dim(ym))),cat:r.cat,wid:r.wid,cid:null,paid:false,rid:r.id,gid:null});
    changed=true;
  });
  if(changed)save();
}

function niceNum(x){var p=Math.pow(10,Math.floor(Math.log10(x))),f=x/p;return(f<=1?1:f<=2?2:f<=5?5:10)*p}
function scale(mn,mx){
  if(mx<=mn)mx=mn+1;
  var step=niceNum((mx-mn)/4),lo=Math.floor(mn/step)*step,hi=Math.ceil(mx/step)*step,t=[];
  for(var v=lo;v<=hi+step/2;v+=step)t.push(Math.round(v*100)/100);
  return{lo:lo,hi:hi,t:t};
}
function barsChart(labels,A,B,nA,nB){
  var W=640,H=250,L=46,R=8,T=12,Bt=30,iw=W-L-R,ih=H-T-Bt;
  var sc=scale(0,Math.max.apply(null,A.concat(B,[0])));
  var y=function(v){return T+ih-((v-sc.lo)/(sc.hi-sc.lo))*ih};
  var g='';
  sc.t.forEach(function(v){var yy=y(v);g+='<line class="grid" x1="'+L+'" x2="'+(W-R)+'" y1="'+yy+'" y2="'+yy+'"/><text class="ax" x="'+(L-6)+'" y="'+(yy+4)+'" text-anchor="end">'+fmtC(v)+'</text>'});
  var n=labels.length,gw=iw/n,bw=Math.min(20,gw*.34),step=Math.ceil(n/8);
  labels.forEach(function(lb,i){
    var cx=L+gw*i+gw/2;
    [[A[i],cx-bw-1,'var(--accent)',nA],[B[i],cx+1,'var(--danger)',nB]].forEach(function(s){
      var h=s[0]>0?Math.max(2,y(0)-y(s[0])):0;
      g+='<rect x="'+s[1]+'" y="'+(y(0)-h)+'" width="'+bw+'" height="'+h+'" rx="2" fill="'+s[2]+'"><title>'+esc(lb)+' · '+s[3]+': '+brl(s[0])+'</title></rect>';
    });
    if(i%step===0)g+='<text class="ax" x="'+cx+'" y="'+(H-9)+'" text-anchor="middle">'+esc(lb)+'</text>';
  });
  return '<div class="money"><svg class="ch" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Gráfico de barras: '+nA+' e '+nB+' por mês">'+g+'</svg></div>';
}
function lineChart(labels,vals,name){
  var W=640,H=230,L=50,R=16,T=22,Bt=28,iw=W-L-R,ih=H-T-Bt;
  var sc=scale(Math.min(0,Math.min.apply(null,vals)),Math.max(0,Math.max.apply(null,vals)));
  var y=function(v){return T+ih-((v-sc.lo)/(sc.hi-sc.lo))*ih};
  var n=vals.length,x=function(i){return L+(n===1?iw/2:iw*i/(n-1))};
  var g='';
  sc.t.forEach(function(v){var yy=y(v);g+='<line class="'+(v===0?'zero':'grid')+'" x1="'+L+'" x2="'+(W-R)+'" y1="'+yy+'" y2="'+yy+'"/><text class="ax" x="'+(L-6)+'" y="'+(yy+4)+'" text-anchor="end">'+fmtC(v)+'</text>'});
  var pts=vals.map(function(v,i){return x(i)+','+y(v)});
  g+='<path d="M'+x(0)+','+y(0)+' L'+pts.join(' L')+' L'+x(n-1)+','+y(0)+' Z" fill="var(--accent)" opacity=".12"/>';
  g+='<polyline points="'+pts.join(' ')+'" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>';
  var step=Math.ceil(n/7);
  vals.forEach(function(v,i){
    g+='<circle cx="'+x(i)+'" cy="'+y(v)+'" r="'+(i===n-1?5:2.5)+'" fill="var(--accent)" stroke="var(--surface)" stroke-width="'+(i===n-1?2:0)+'"><title>'+esc(labels[i])+': '+brl(v)+'</title></circle>';
    if(i%step===0||i===n-1)g+='<text class="ax" x="'+x(i)+'" y="'+(H-9)+'" text-anchor="middle">'+esc(labels[i])+'</text>';
  });
  g+='<text class="lv" x="'+Math.min(x(n-1),W-R-4)+'" y="'+(y(vals[n-1])-10)+'" text-anchor="end">'+fmtC(vals[n-1])+'</text>';
  return '<div class="money"><svg class="ch" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(name)+'">'+g+'</svg></div>';
}
function hbars(items,total,max){
  if(!items.length)return '<p class="sub">Sem dados no período.</p>';
  items=items.slice(0,max||8);
  var top=items[0].value||1;
  return '<div class="hb">'+items.map(function(it){
    var pct=total>0?it.value/total*100:0;
    return '<div class="it"><div class="t"><span>'+esc(it.label)+'</span><span><span class="money">'+brl(it.value)+'</span> · '+pct.toFixed(0)+'%</span></div><div class="bar"><i style="width:'+(it.value/top*100)+'%"></i></div></div>';

function collect(cfg){
  var vals={},errs={};
  cfg.fields.forEach(function(f){
    var el=$('#f_'+f.name,ov);if(!el)return;
    var raw=f.type==='checkbox'?el.checked:el.value.trim(),val=raw;
    if(f.type==='money'){
      if(raw===''){if(f.required)errs[f.name]='Informe um valor.';val=NaN}
      else{val=parseMoney(raw);if(isNaN(val)||val<=0)errs[f.name]='Informe um valor válido maior que zero. Exemplo: 1.250,50';else if(val>999999999)errs[f.name]='Valor alto demais.'}

      if(raw===''){if(f.required)errs[f.name]='Informe a data.'}else if(!validDate(raw))errs[f.name]='Data inválida.';

function importData(text){

  var d=o&&o.data?o.data:o;
  if(!d||!Array.isArray(d.tx)){toast('Arquivo inválido: não parece um backup do Financeiro PC.');return}
  var n=migrate(d);
  confirmBox('Restaurar o backup com <strong>'+n.tx.length+' lançamentos</strong>, '+n.goals.length+' metas e '+n.cards.length+' cartões? Os dados atuais serão substituídos, mas uma cópia fica guardada para reverter.','Restaurar',function(){

 fillName:function(el){var i=$('#f_name',ov);if(i){i.value=el.dataset.v;i.focus()}},
 addCard:function(){cardForm()},editCard:function(el){cardForm(find(S.cards,el.dataset.id))},selCard:function(el){U.card=el.dataset.id;render()},
 delCard:function(el){var c=find(S.cards,el.dataset.id);confirmBox('Excluir o cartão <strong>'+esc(c.name)+'</strong>? As compras continuam nas despesas, sem vínculo com o cartão.','Excluir',function(){S.cards=S.cards.filter(function(x){return x.id!==c.id});S.tx.forEach(function(t){if(t.cid===c.id)t.cid=null});U.card=null;save();render()},true)},
 buyCard:function(el){txForm('out',null,el.dataset.id)},
 payInv:function(el){var c=find(S.cards,el.dataset.id),it=invItems(c,cur),all=it.every(function(t){return t.paid});it.forEach(function(t){t.paid=!all});save();render();toast(all?'Pagamento da fatura desfeito.':'Fatura marcada como paga.')},
 addRec:function(){recForm()},editRec:function(el){recForm(find(S.rec,el.dataset.id))},
 togRec:function(el){var r=find(S.rec,el.dataset.id);r.active=!r.active;save();render()},
 delRec:function(el){var r=find(S.rec,el.dataset.id);confirmBox('Excluir a conta fixa <strong>'+esc(r.desc)+'</strong>? Os lançamentos já feitos continuam; só deixa de ser lançada nos próximos meses.','Excluir',function(){S.rec=S.rec.filter(function(x){return x.id!==r.id});save();render()},true)},
 novaFrase:function(){U.mi++;render()},
 repMode:function(el){U.rep=el.dataset.m;render()},
 exportJson:function(){textBox('Backup dos dados','Salve este texto em um arquivo .json. Para restaurar, use "Restaurar backup".',JSON.stringify({app:'FINANCEIRO PC',version:1,exportedAt:new Date().toISOString(),data:S},null,1),'financeiro-pc-backup-'+todayISO()+'.json','application/json')},
 exportCsv:function(){if(!S.tx.length){toast('Não há lançamentos para exportar.');return}textBox('Planilha CSV','Abre no Excel e no Google Planilhas. Separador: ponto e vírgula.',csv(),'financeiro-pc-'+todayISO()+'.csv','text/csv;charset=utf-8')},
 importText:function(){if(D)return toast('Saia da demonstração primeiro.');openSheet('<div class="sh-head"><h2>Colar backup</h2><button type="button" class="x" data-a="close" aria-label="Fechar">×</button></div><textarea id="pt" aria-label="Texto do backup" placeholder="Cole aqui o conteúdo do arquivo .json"></textarea><div class="sh-foot"><button type="button" class="btn ghost" data-a="close">Cancelar</button><button type="button" class="btn" id="ptOk">Continuar</button></div>',true);$('#ptOk',ov).onclick=function(){var v=$('#pt',ov).value;closeModal();importData(v)}},
 revertImport:function(){var raw=lsGet(PREV);if(!raw)return;confirmBox('Voltar aos dados que existiam antes da última restauração?','Reverter',function(){try{S=migrate(JSON.parse(raw));lsSet(PREV,'');save();render();toast('Dados revertidos.')}catch(e){toast('Cópia anterior inválida.')}})},
 resetAll:function(){
  if(D)return toast('Saia da demonstração primeiro.');
  openSheet('<div class="sh-head"><h2>Apagar todos os dados</h2><button type="button" class="x" data-a="close" aria-label="Fechar">×</button></div><p style="margin-bottom:12px">Isto remove tudo deste navegador. Digite <strong>APAGAR</strong> para confirmar.</p><div class="fld"><input id="rt" type="text" autocomplete="off" aria-label="Digite APAGAR"></div><div class="sh-foot"><button type="button" class="btn ghost" data-a="close">Cancelar</button><button type="button" class="btn" id="rtOk" style="background:var(--danger);color:#1a0508">Apagar tudo</button></div>');
  $('#rtOk',ov).onclick=function(){if($('#rt',ov).value.trim().toUpperCase()!=='APAGAR'){toast('Digite APAGAR para confirmar.');return}lsSet(PREV,JSON.stringify(S));S=blank();save();closeModal();render();toast('Dados apagados.')};
 },
 demoOn:function(){D=true;S=genDemo();cur=ymOf(todayISO());if(!location.hash||location.hash==='#dados')location.hash='visao';render();window.scrollTo(0,0)},
 demoOff:function(){D=false;S=loadReal();render();toast('Voltou aos seus dados.')}
};

/* ==========================================================================
   9. EVENTOS
   ========================================================================== */
document.addEventListener('click',function(e){
  if(e.target===ov&&!ov.hidden){closeModal();return}
  var el=e.target.closest('[data-a]');if(!el)return;
  var fn=A[el.dataset.a];if(fn){e.preventDefault();fn(el)}
});
document.addEventListener('submit',function(e){if(e.target.id==='mform'){e.preventDefault();submitForm()}});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!ov.hidden)closeModal()});
document.addEventListener('input',function(e){
  if(e.target.id==='q'){U.q=e.target.value;var l=$('#txlist');if(l)l.innerHTML=txRows(route()==='receitas'?'in':'out')}
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='monthSel'){if(/^\d{4}-\d{2}$/.test(t.value)){cur=t.value;render()}}
  else if(t.dataset&&t.dataset.f){U[t.dataset.f]=t.value;render()}
  else if(t.id==='impfile'&&t.files&&t.files[0]){
    if(D){toast('Saia da demonstração primeiro.');t.value='';return}
    var fr=new FileReader();fr.onload=function(){importData(String(fr.result))};fr.onerror=function(){toast('Não foi possível ler o arquivo.')};fr.readAsText(t.files[0]);t.value='';
  }
});
window.addEventListener('hashchange',function(){U.q='';render();window.scrollTo(0,0)});
render();
})();
</script>
